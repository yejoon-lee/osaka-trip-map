<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f2eb">
<meta name="description" content="오사카의 저장한 장소 77곳을 카테고리별 목록으로 보고 Google Maps에서 확인하세요.">
<title>오사카 장소 목록</title>
<link rel="stylesheet" href="styles.css?v=3">
<script type="module" src="app.js?v=3"></script>
</head>
<body>
<a class="skip" href="#results">장소 목록으로 건너뛰기</a>
<header><h1>오사카 장소 목록</h1><p>저장한 장소를 둘러보고, Google Maps에서 확인하세요.</p></header>
<section class="filters" aria-label="장소 필터">
<label class="search-wrap"><span class="sr-only">장소 검색</span><input id="search" type="search" placeholder="이름, 종류, 메모 검색" autocomplete="off"></label>
<div class="filter-row"><label class="area-wrap"><span class="sr-only">지역</span><select id="area"><option value="">모든 지역</option></select></label><button id="reset" type="button">초기화</button></div>
<div id="categories" class="chips" aria-label="카테고리"></div>
</section>
<main id="results" tabindex="-1">
<p class="results-heading" role="status">저장한 장소 <strong id="count">—</strong>곳 <span id="filter-label">전체</span></p>
<div id="list"></div>
<div id="empty" class="empty" hidden><h2>검색 결과가 없어요</h2><p>검색어를 바꾸거나 필터를 초기화해 보세요.</p><button id="empty-reset" type="button">필터 초기화</button></div>
<p id="data-status" role="status">장소를 불러오는 중…</p>
</main>
<footer><p>출처 · <span id="source">Google Maps 저장 목록</span></p><p>저장 목록의 스냅샷입니다. 메모의 가격·재고·영업 정보는 실시간 정보가 아닙니다. 방문 전 Google Maps에서 확인하세요.</p></footer>
<noscript><p>장소 목록을 보려면 JavaScript를 켜 주세요.</p></noscript>
</body>
</html>
